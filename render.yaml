# Render Blueprint — free-tier web service running the existing Dockerfile.
# Everything else is already on free tiers elsewhere (Neon, Upstash, R2, Resend),
# so secrets are `sync: false`: Render prompts for them once on first deploy.
services:
  - type: web
    name: tedis
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database (ap-southeast-1)
    dockerfilePath: ./Dockerfile
    # /api/ping, NOT /api/health — health queries Postgres, and a probe every
    # few seconds would keep Neon's compute awake and exhaust its free hours.
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Free instances have 512 MB RAM; cap V8's heap so Node GCs before the
      # container is OOM-killed (leaves headroom for sharp/argon2 native memory).
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: APP_NAME
        value: TedIS
      - key: APP_URL # also passed to `docker build` as an ARG (metadataBase)
        value: https://tedis.uk
      - key: WEBAUTHN_RP_ID
        value: tedis.uk
      - key: WEBAUTHN_RP_NAME
        value: TedIS
      - key: WEBAUTHN_ORIGIN
        value: https://tedis.uk
      - key: EMAIL_PROVIDER
        value: resend
      - key: S3_REGION
        value: auto
      - { key: DATABASE_URL, sync: false }
      - { key: DIRECT_DATABASE_URL, sync: false }
      - { key: REDIS_URL, sync: false }
      - { key: SESSION_SECRET, sync: false }
      - { key: CSRF_SECRET, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - key: EMAIL_FROM
        value: TedIS <no-reply@tedis.uk>
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: S3_PUBLIC_URL, sync: false }
