name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    # Dummy but format-valid env so Zod env validation + `next build` prerender pass.
    # These are NOT secrets — real values live in the host's env at deploy time.
    env:
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      # Required, not optional: schema.prisma declares `directUrl`, and Prisma
      # errors on an unset one rather than falling back to DATABASE_URL — so
      # `prisma validate` fails before any other step runs without this.
      # Same value here; CI never connects, it only parses the schema.
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-dummy-session-secret-at-least-32-chars-long
      CSRF_SECRET: ci-dummy-csrf-secret-at-least-32-chars-long-xx
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_NAME: TedIS
      WEBAUTHN_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Validate Prisma schema
        run: pnpm prisma validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
